name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_call:
    inputs:
      checkout_ref:
        description: 'Git ref to scan; defaults to the triggering ref'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.5'
      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit and validate exceptions
        working-directory: frontend
        run: |
          set -euo pipefail
          audit_file="$(mktemp)"
          trap 'rm -f "$audit_file"' EXIT

          # pnpm 9 can return non-zero for lower-severity findings even when
          # --audit-level=high is used. Preserve the complete JSON and let the
          # policy checker distinguish findings from audit-service failures.
          set +e
          pnpm audit --prod --audit-level=high --json \
            --registry=https://registry.npmjs.org > "$audit_file"
          audit_status=$?
          set -e

          echo "pnpm audit exited with status $audit_status; validating JSON policy"
          python ../tools/check_pnpm_audit_exceptions.py \
            --audit "$audit_file" \
            --exceptions ../.github/audit-exceptions.yml
